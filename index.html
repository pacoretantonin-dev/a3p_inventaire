<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I3P</title>
<style>
:root{color-scheme:light;--g:#8c8c8c;--l:#e4e4e4;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#000;font-family:var(--sans);font-size:13px;line-height:1.4}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid #000;outline-offset:3px}
#intro{position:fixed;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;z-index:50;width:100%;cursor:pointer;transition:opacity .7s ease}
#intro span{font-size:clamp(72px,20vw,260px);font-weight:700;letter-spacing:-.05em;line-height:1}
#intro.out{opacity:0;pointer-events:none}
#site{opacity:0;transition:opacity .7s ease}
#site.in{opacity:1}
header{display:flex;justify-content:space-between;align-items:baseline;padding:18px 24px;gap:16px;flex-wrap:wrap}
#logo{font-weight:700;font-size:20px;letter-spacing:-.04em}
.meta{color:var(--g);display:flex;gap:18px;align-items:baseline}
.meta button{color:var(--g)}.meta button.on{color:#000;text-decoration:underline;text-underline-offset:3px}
nav{padding:0 24px 18px;border-bottom:1px solid var(--l)}
.row{display:flex;gap:4px 18px;flex-wrap:wrap;padding:3px 0}
.row i{font-style:normal;color:var(--g);width:100px;flex:none}
.row button{color:var(--g)}.row button:hover{color:#000}
.row button.on{color:#000;text-decoration:underline;text-underline-offset:3px}
#grid{padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:30px 14px}
.card{cursor:pointer;text-align:left;display:block;width:100%}
.fr{aspect-ratio:4/3;background:#f2f2f2;overflow:hidden}
.fr img{width:100%;height:100%;object-fit:cover;display:block}
.cap{padding-top:7px;font-size:12px}.cap .n{color:var(--g);margin-right:8px}.cap .g{display:block;color:var(--g)}
#grid.free{display:block;columns:4 230px;column-gap:14px}
#grid.free .card{break-inside:avoid;margin-bottom:30px}
#grid.free .fr{aspect-ratio:auto}#grid.free .fr img{height:auto}
#empty{padding:60px 24px;color:var(--g)}
footer{padding:40px 24px 28px;color:var(--g);display:flex;gap:18px;flex-wrap:wrap}
footer button{color:var(--g)}footer button:hover{color:#000}
.ov{position:fixed;inset:0;background:rgba(255,255,255,.96);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.open{display:flex}
.box{background:#fff;border:1px solid #000;padding:24px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.box h2{margin:0 0 6px;font-size:18px;font-weight:700;letter-spacing:-.02em}
label{display:block;color:var(--g);margin:14px 0 3px}
select,input{width:100%;padding:7px 0;border:0;border-bottom:1px solid #000;border-radius:0;background:transparent;font-size:14px}
.hint{color:var(--g);font-size:12px;margin-top:8px}
.foot{display:flex;gap:18px;justify-content:flex-end;margin-top:22px}
.b{font-weight:700}.b.d{color:#b3261e}
.tags{display:flex;gap:6px 10px;flex-wrap:wrap;margin:6px 0}.tags span{border:1px solid var(--l);padding:2px 8px}.tags button{color:var(--g);margin-left:6px}
.add{display:flex;gap:12px;align-items:end}
.lb{background:#fff;width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px}
.lb .pic{display:flex;align-items:center;justify-content:center;min-height:0}
.lb img{max-width:100%;max-height:92vh;object-fit:contain}
.lb .side{overflow:auto;padding:8px 0}
.nav{display:flex;gap:16px;margin-bottom:18px}
@media(max-width:760px){.lb{grid-template-columns:1fr;grid-template-rows:55% auto;overflow:auto}.row i{width:100%}header,nav,#grid,footer{padding-left:14px;padding-right:14px}}
#st{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#000;color:#fff;padding:8px 14px;display:none;z-index:60}
</style>
</head>
<body>
<button id="intro" aria-label="Entrer dans le site"><span>I3P</span></button>
<div id="site">
<header><button id="logo">I3P</button><div class="meta"><span id="count"></span><button id="vu" class="on">Grille</button><button id="vf">Libre</button></div></header>
<nav id="filters"></nav>
<main><div id="grid"></div><p id="empty" hidden></p></main>
<footer id="foot"></footer>
</div>

<div class="ov" id="lgOv"><div class="box"><h2>Connexion</h2>
<div class="hint">Un jeton GitHub (permission « Contents : Read and write » sur ce dépôt uniquement) permet d'ajouter des photos depuis le site. Il reste dans ce navigateur.</div>
<label>Compte GitHub</label><input id="gO"><label>Dépôt</label><input id="gR"><label>Branche</label><input id="gB" value="main"><label>Jeton</label><input id="gT" type="password" autocomplete="off">
<div class="hint" id="lgErr"></div>
<div class="foot"><button id="lgNo">Annuler</button><button class="b" id="lgOk">Se connecter</button></div></div></div>

<div class="ov" id="adOv"><div class="box"><h2>Ajouter des photos</h2><div class="hint" id="adInfo"></div><div id="adForm"></div>
<div class="foot"><button id="adNo">Annuler</button><button class="b" id="adOk">Importer</button></div></div></div>

<div class="ov" id="mnOv"><div class="box"><h2>Catégories</h2><div id="mnBody"></div><div class="foot"><button class="b" id="mnX">Fermer</button></div></div></div>

<div class="ov" id="lbOv"><div class="lb"><div class="pic"><img id="lbImg" alt=""></div><div class="side">
<div class="nav"><button id="pv">Précédente</button><button id="nx">Suivante</button><button id="lbX" style="margin-left:auto">Fermer</button></div><div id="lbBody"></div></div></div></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<div id="st"></div>

<script>
const DIMS=[["category","Catégorie","categories"],["typology","Typologie","typologies"],["view","Prise de vue","views"]];
let data={taxonomy:{categories:[],typologies:[],views:[]},photos:[]},sel={category:"",typology:"",view:""},cur=-1,pending=[],cfg=null,local={};
const $=id=>document.getElementById(id),LS="i3p-gh";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say=(t,ms=3000)=>{const s=$("st");s.textContent=t;s.style.display="block";if(ms)setTimeout(()=>s.style.display="none",ms)};
try{cfg=JSON.parse(localStorage.getItem(LS))}catch(e){}
const sorted=()=>[...data.photos].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
const src=p=>local[p.file]||"photos/"+encodeURIComponent(p.file);
const vals=(d,k)=>{const s=new Set(data.taxonomy[k]||[]);data.photos.forEach(p=>p[d]&&s.add(p[d]));return[...s]};
const shown=()=>sorted().filter(p=>DIMS.every(([d])=>!sel[d]||p[d]===sel[d]));

/* intro */
$("intro").onclick=()=>{$("intro").classList.add("out");$("site").classList.add("in")};
$("logo").onclick=()=>{$("intro").classList.remove("out");$("site").classList.remove("in")};
$("vu").onclick=()=>{$("grid").className="";$("vu").className="on";$("vf").className=""};
$("vf").onclick=()=>{$("grid").className="free";$("vf").className="on";$("vu").className=""};

function render(){
  $("filters").innerHTML=DIMS.map(([d,l,k])=>`<div class="row"><i>${l}</i><button class="${!sel[d]?"on":""}" data-d="${d}" data-v="">Tout</button>${vals(d,k).map(v=>`<button class="${sel[d]===v?"on":""}" data-d="${d}" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>`).join("");
  const all=sorted(),list=shown();
  $("count").textContent=all.length?`${list.length} / ${all.length}`:"";
  $("grid").innerHTML=list.map(p=>`<button class="card" data-f="${esc(p.file)}"><div class="fr"><img loading="lazy" src="${esc(src(p))}" alt="${esc(p.title)}"></div><div class="cap"><span class="n">${String(all.length-all.indexOf(p)).padStart(3,"0")}</span>${esc(p.title)}<span class="g">${esc([p.category,p.typology].filter(Boolean).join(", "))}</span></div></button>`).join("");
  const e=$("empty");e.hidden=!!list.length;e.textContent=all.length?"Aucune photo ne correspond à ces filtres.":"L'archive est vide.";
  $("foot").innerHTML=cfg?`<button id="fA">Ajouter des photos</button><button id="fC">Catégories</button><button id="fX">Déconnexion</button>`:`<button id="fL">Administration</button>`;
}
$("filters").onclick=e=>{const b=e.target.closest("button");if(b){sel[b.dataset.d]=b.dataset.v;render()}};
$("foot").onclick=e=>{const i=e.target.id;
  if(i==="fL"){const m=location.hostname.match(/^(.+)\.github\.io$/);$("gO").value=cfg?.owner||(m?m[1]:"");$("gR").value=cfg?.repo||(m?(location.pathname.split("/")[1]||m[1]+".github.io"):"");$("lgOv").classList.add("open")}
  if(i==="fX"){cfg=null;try{localStorage.removeItem(LS)}catch(e){}render()}
  if(i==="fA")$("fileIn").click();if(i==="fC"){man();$("mnOv").classList.add("open")}};

/* GitHub */
async function gh(path,o={}){const m=o.method||"GET";const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`+(m==="GET"?`?ref=${cfg.branch}&t=${Date.now()}`:""),{method:m,headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json"},body:o.body?JSON.stringify(o.body):undefined});
  if(!r.ok){let t="";try{t=(await r.json()).message}catch(e){}throw new Error(r.status+" "+t)}return r.json()}
const u8b=s=>{const b=new TextEncoder().encode(s);let x="";for(let i=0;i<b.length;i+=8192)x+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(x)};
const b8u=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,"")),c=>c.charCodeAt(0)));
async function commit(mut,msg){let f=null;try{f=await gh("photos.json")}catch(e){if(!/^404/.test(e.message))throw e}
  const j=f?JSON.parse(b8u(f.content)):{taxonomy:data.taxonomy,photos:[]};mut(j);
  await gh("photos.json",{method:"PUT",body:{message:msg,content:u8b(JSON.stringify(j,null,1)),branch:cfg.branch,sha:f?.sha}});data=j;render()}
$("lgNo").onclick=()=>$("lgOv").classList.remove("open");
$("lgOk").onclick=async()=>{cfg={owner:$("gO").value.trim(),repo:$("gR").value.trim(),branch:$("gB").value.trim()||"main",token:$("gT").value.trim()};
  try{await gh("photos.json");try{localStorage.setItem(LS,JSON.stringify(cfg))}catch(e){}$("lgOv").classList.remove("open");$("gT").value="";render();say("Connecté")}
  catch(e){cfg=null;$("lgErr").textContent="Connexion impossible ("+e.message+"). Vérifie le compte, le dépôt et le jeton."}};

/* formulaires */
const selects=v=>DIMS.map(([d,l,k])=>{const o=vals(d,k);return`<label>${l}</label><select data-d="${d}" data-k="${k}"><option value="">—</option>${o.map(x=>`<option value="${esc(x)}" ${v[d]===x?"selected":""}>${esc(x)}</option>`).join("")}<option value="__n">Nouvelle valeur…</option></select>`}).join("");
const wire=r=>r.querySelectorAll("select").forEach(s=>s.onchange=async()=>{if(s.value!=="__n")return;const v=(prompt("Nom de la nouvelle valeur :")||"").trim();if(!v){s.value="";return}
  try{await commit(j=>{const a=j.taxonomy[s.dataset.k]=j.taxonomy[s.dataset.k]||[];if(!a.includes(v))a.push(v)},"Nouvelle valeur");const o=document.createElement("option");o.value=o.textContent=v;s.insertBefore(o,s.lastElementChild);s.value=v}catch(e){say("Erreur : "+e.message,5000);s.value=""}});
const rd=r=>{const o={};r.querySelectorAll("select").forEach(s=>o[s.dataset.d]=s.value==="__n"?"":s.value);return o};

/* import */
const resize=(f,m=2000)=>new Promise((ok,ko)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(new Error("conversion")),"image/jpeg",.86)};i.onerror=()=>ko(new Error("image illisible"));i.src=u});
const bb=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(b)});
$("fileIn").onchange=e=>{pending=[...e.target.files];e.target.value="";if(!pending.length)return;
  $("adInfo").textContent=`${pending.length} photo(s). Ces informations s'appliquent à toutes ; tu pourras les modifier une par une.`;
  $("adForm").innerHTML=`<label>Titre (sinon nom du fichier)</label><input id="aT">`+selects({});wire($("adForm"));$("adOv").classList.add("open")};
$("adNo").onclick=()=>{$("adOv").classList.remove("open");pending=[]};
$("adOk").onclick=async()=>{const meta=rd($("adForm")),t=$("aT").value.trim(),out=[];$("adOv").classList.remove("open");let n=0;
  for(const f of pending){say(`Import ${++n}/${pending.length}…`,0);
    try{const b=await resize(f),name=Date.now()+"-"+n+".jpg";local[name]=URL.createObjectURL(b);
      await gh("photos/"+name,{method:"PUT",body:{message:"Ajout "+name,content:await bb(b),branch:cfg.branch}});
      out.push({file:name,title:t||f.name.replace(/\.[^.]+$/,""),...meta,date:new Date().toISOString()})}catch(err){say("Échec : "+err.message,6000)}}
  pending=[];if(out.length){try{await commit(j=>j.photos.push(...out),"Ajout de "+out.length+" photo(s)");say("Importé. En ligne sur le site public dans environ une minute.",6000)}catch(err){say("Échec : "+err.message,6000)}}};

/* catégories */
function man(){$("mnBody").innerHTML=DIMS.map(([d,l,k])=>`<label>${l}</label><div class="tags">${(data.taxonomy[k]||[]).map((v,i)=>`<span>${esc(v)}<button data-k="${k}" data-i="${i}" aria-label="Retirer">×</button></span>`).join("")}</div><div class="add"><input data-a="${k}" placeholder="Ajouter"><button class="b" data-ab="${k}">Ajouter</button></div>`).join("")+`<div class="hint">Retirer une valeur ne supprime pas les photos qui l'utilisent.</div>`}
$("mnX").onclick=()=>{$("mnOv").classList.remove("open");render()};
$("mnBody").onclick=async e=>{const b=e.target.closest("button");if(!b)return;let f;
  if(b.dataset.i!==undefined)f=j=>j.taxonomy[b.dataset.k].splice(+b.dataset.i,1);
  else if(b.dataset.ab){const v=$("mnBody").querySelector(`[data-a="${b.dataset.ab}"]`).value.trim();if(!v)return;f=j=>{const a=j.taxonomy[b.dataset.ab];if(!a.includes(v))a.push(v)}}else return;
  try{await commit(f,"Catégories");man()}catch(err){say("Erreur : "+err.message,5000)}};

/* visionneuse */
function open(i){const l=shown();if(!l.length)return;cur=(i+l.length)%l.length;const p=l[cur];$("lbImg").src=src(p);
  $("lbBody").innerHTML=cfg?`<label style="margin-top:0">Titre</label><input id="eT" value="${esc(p.title)}">${selects(p)}<div class="foot" style="justify-content:space-between"><button class="b d" id="del">Supprimer</button><button class="b" id="sv">Enregistrer</button></div>`
   :`<div class="b" style="font-size:15px">${esc(p.title)}</div>${DIMS.map(([d,l])=>p[d]?`<div style="color:var(--g)">${l} : <span style="color:#000">${esc(p[d])}</span></div>`:"").join("")}`;
  if(cfg){wire($("lbBody"));
   $("sv").onclick=async()=>{const o={title:$("eT").value.trim(),...rd($("lbBody"))};try{await commit(j=>Object.assign(j.photos.find(x=>x.file===p.file)||{},o),"Modification");say("Enregistré")}catch(e){say("Erreur : "+e.message,5000)}};
   $("del").onclick=async()=>{if(!confirm("Supprimer cette photo définitivement ?"))return;try{const f=await gh("photos/"+encodeURIComponent(p.file));await gh("photos/"+encodeURIComponent(p.file),{method:"DELETE",body:{message:"Suppression "+p.file,sha:f.sha,branch:cfg.branch}});await commit(j=>{j.photos=j.photos.filter(x=>x.file!==p.file)},"Suppression");$("lbOv").classList.remove("open")}catch(e){say("Erreur : "+e.message,5000)}}}
  $("lbOv").classList.add("open")}
$("grid").onclick=e=>{const c=e.target.closest(".card");if(c)open(shown().findIndex(p=>p.file===c.dataset.f))};
$("pv").onclick=()=>open(cur-1);$("nx").onclick=()=>open(cur+1);$("lbX").onclick=()=>$("lbOv").classList.remove("open");
document.addEventListener("keydown",e=>{if(!$("lbOv").classList.contains("open")||/INPUT|SELECT/.test(e.target.tagName))return;if(e.key==="ArrowLeft")open(cur-1);if(e.key==="ArrowRight")open(cur+1);if(e.key==="Escape")$("lbOv").classList.remove("open")});

fetch("photos.json?t="+Date.now()).then(r=>r.json()).then(j=>{data=j}).catch(()=>{}).finally(render);
render();
</script>
</body>
</html>
